{% extends "base.html" %}

{% block title %}Přihlášení · Živý překlad{% endblock %}

{% block head %}
<style>
  .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: min(440px, 100%); padding: clamp(28px, 6vw, 48px); }
  .login-card h1 { font-size: clamp(2rem, 10vw, 3.3rem); }
  .field { display: grid; gap: 8px; margin: 28px 0 18px; }
  .field label { font-weight: 700; }
  .field input {
    width: 100%; min-height: 52px; padding: 0 15px;
    border: 1px solid var(--line); border-radius: 13px;
    color: var(--text); background: var(--surface-strong);
  }
  .login-card .primary-button { width: 100%; }
  .error { margin: 0 0 16px; color: var(--danger); font-weight: 650; }
</style>
{% endblock %}

{% block body %}
<main class="login-shell">
  <section class="panel login-card" aria-labelledby="login-title">
    <p class="eyebrow">Chráněný přístup</p>
    <h1 id="login-title">Živý překlad</h1>
    <p class="muted">Čeština ze zvuku přímo do angličtiny a ruštiny.</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_path }}">
      <div class="field">
        <label for="password">Heslo</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      {% if invalid_pwd %}<p class="error" role="alert">Nesprávné heslo.</p>{% endif %}
      <button class="primary-button" type="submit">Pokračovat</button>
    </form>
  </section>
</main>
{% endblock %}
