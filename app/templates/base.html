<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Živý překlad{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1eb;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: #ffffff;
      --text: #18211c;
      --muted: #637068;
      --line: rgba(24, 33, 28, 0.12);
      --accent: #0e7655;
      --accent-hover: #095d43;
      --accent-soft: #dff3ea;
      --danger: #b44343;
      --shadow: 0 24px 70px rgba(31, 46, 37, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111713;
        --surface: rgba(28, 38, 32, 0.88);
        --surface-strong: #1c2620;
        --text: #eef4ef;
        --muted: #a4b0a8;
        --line: rgba(238, 244, 239, 0.12);
        --accent: #55d5a3;
        --accent-hover: #79e5ba;
        --accent-soft: #183c2e;
        --danger: #ff8f8f;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 32rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
      outline-offset: 3px;
    }

    .shell {
      width: min(1060px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 6vw, 4.25rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .muted { color: var(--muted); }

    .primary-button {
      min-height: 54px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-weight: 750;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .primary-button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .primary-button:disabled { cursor: wait; opacity: 0.58; }

    .primary-button[data-active="true"] { background: var(--danger); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 1060px); padding-top: 22px; }
      .panel { border-radius: 18px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
