name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    # Public repo + self-hosted runner: only run trusted code on our box, never
    # an untrusted pull request opened from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Build deployment image
        run: docker build -t realtime-stt-translator-ci:${{ github.sha }} .
      - name: Remove deployment image
        if: always()
        run: docker image rm -f realtime-stt-translator-ci:${{ github.sha }} || true
